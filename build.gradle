plugins {
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom-remap' version '1.15.+'
	id 'ploceus' version '1.15-SNAPSHOT'
	// Emits retrocommands-<version>-babric.jar: reverse-converted to babric and bundled with OSL.
	id 'com.periut.retroconvert' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

ploceus {
	setIntermediaryGeneration(2)
}

loom {
	accessWidenerPath = file("src/main/resources/retrocommands.accesswidener")
}

// The OSL gen2 modules retrocommands actually needs, jar-in-jar'd so the mod runs standalone.
// osl-networking hard-depends on core, entrypoints and lifecycle-events, and networking-impl
// provides the b1.7.3 implementation. Versions track OSL 0.18.0.
//
// These are nested into the ornithe jar by `include` below. The -babric jar is produced by
// reverse-converting that jar, and retroconvert reverse-converts META-INF/jars/ entries along
// with it - so the babric jar carries the same modules, babric-mapped. One source of truth for
// both flavours; do NOT also list them in `retroconvert { bundle ... }` or they land twice.
ext.oslModules = [
	"net.ornithemc.osl-gen2:core:0.7.1",
	"net.ornithemc.osl-gen2:entrypoints:0.6.0+mca1.0.1_01-mc1.5.2",
	"net.ornithemc.osl-gen2:lifecycle-events:0.6.0+mcb1.3-mcb1.7.3",
	"net.ornithemc.osl-gen2:networking:0.9.0+mcb1.0-mc13w39b",
	"net.ornithemc.osl-gen2:networking-impl:0.1.1+mcb1.5-mc11w48a",
]

repositories {
	mavenLocal()
	maven { url = 'https://mvn.devos.one/releases' }
	maven { url = "https://maven.glass-launcher.net/releases" }
	maven { url = "https://maven.glass-launcher.net/babric" }
	maven { url = "https://maven.glass-launcher.net/snapshots" }
	maven { url = "https://maven.ornithemc.net/releases" }
	maven { url = "https://matthewperiut.github.io/repository" }
	maven { url = "https://jitpack.io/" }
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven{ url = "https://api.modrinth.com/maven" }
		}
		filter {
			includeGroup("maven.modrinth")
		}
	}
}

// NOTHING retrocommands depends on may reach a mod that depends on retrocommands.
//
// Only two Gradle configurations are ever published: apiElements (POM "compile") and
// runtimeElements (POM "runtime"). `implementation`, `api`, `compileOnlyApi`, `runtimeOnly`
// and Loom's `modImplementation`/`modApi`/`modRuntimeOnly` all feed one of those, so none of
// them may be used here. The safe set is:
//
//   compileOnly / modCompileOnly  - compile against it, never publish it, never ship it
//   localRuntime / modLocalRuntime - on the dev-runtime classpath only, never published
//   include                        - jar-in-jar'd into our own jar, never published as a coordinate
//
// Mod APIs we do not compile against are reached by reflection instead (see
// com.periut.retrocommands.optionaldep), which is why cryonicconfig is dev-runtime only.
// `verifyNoPublishedDependencies` below enforces all of this at build time.
dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	mappings(ploceus.mappings("net.glasslauncher:biny-ornithe:b1.7.3+build.${project.biny_mappings}:mergedv2"))

	clientExceptions ploceus.raven(project.client_raven_build, 'client')
	serverExceptions ploceus.raven(project.server_raven_build, 'server')
	clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
	serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
	clientNests "net.glasslauncher:biny-nests:b1.7.3-client+build.${project.client_nests_build}"
	serverNests "net.glasslauncher:biny-nests:b1.7.3-server+build.${project.server_nests_build}"

	// The loader is supplied by whatever launches the mod; we only compile and dev-run against it.
	modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
	modLocalRuntime "net.fabricmc:fabric-loader:${project.loader_version}"

	// Not referenced by any source file - they only need to be on the dev-runtime classpath,
	// where the launcher would otherwise be missing a logging backend.
	localRuntime "org.slf4j:slf4j-api:1.8.0-beta4"
	localRuntime 'org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2'
	localRuntime("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}")
	localRuntime "blue.endless:jankson:1.2.1"
	localRuntime 'com.google.guava:guava:33.2.1-jre'

	modCompileOnly "net.modificationstation:StationAPI:${project.stapi_version}"

	// API Extensions. Optional at runtime and gated behind isModLoaded("retroapi"), so
	// compile-only - a consumer of retrocommands must never inherit it.
	modCompileOnly("com.periut:retroapi:${project.retroapi_version}") { transitive false }

	// OSL: compile against it, dev-run against it, and ship it nested rather than as a
	// published coordinate. `include` is not a published configuration, so this embeds the
	// modules without exporting them to anyone who depends on retrocommands.
	oslModules.each {
		modCompileOnly it
		modLocalRuntime it
		include it
	}

	// osl-networking's API uses netty ByteBuf, which b1.7.3 doesn't ship - JiJ it (same as retroapi).
	include "io.netty:netty-buffer:4.1.77.Final"
	include "io.netty:netty-common:4.1.77.Final"

	// babric's launch has no jopt-simple, which fabric-loader parses its arguments with.
	// retroconvert used to add this itself, but only as part of the `retroconvert { bundle }`
	// pass - and that pass is skipped entirely once the bundle list is empty, which it now is
	// (OSL is nested by `include` above instead). Nest it ourselves so the babric jar keeps it.
	include "net.sf.jopt-simple:jopt-simple:5.0.4"

	// Reached purely by reflection (CryonicConfigCompat), so it is not on the compile
	// classpath at all - this is here only so the dev run can exercise that path.
	modLocalRuntime("com.periut.cryonicconfig:cryonicconfig-ornithe:${project.cryonic_config_version}")

	// starac brings LWJGL 3, which would clash with vanilla
	// Minecraft's LWJGL 2 API, so keep it off the compile classpath.
	modLocalRuntime "com.periut:starac:${project.starac_version}"
}

// Exclude the Legacy Fabric LWJGL 2 wrapper at RUNTIME only (starac provides LWJGL 3).
// It must stay on the compile/minecraft classpath so Condor (Ploceus LVT generator)
// can resolve org.lwjgl.* classes referenced by b1.7.3 — a blanket exclude here
// strips LWJGL 2 from minecraftCompileLibraries and crashes LVT generation.
configurations.matching { it.name.toLowerCase().contains('runtime') }.configureEach {
	exclude group: 'org.lwjgl.lwjgl'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Loom requires J21.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// Backstop for the dependency-configuration rules documented above: if a future edit puts
// anything back on a published configuration, fail the build instead of silently shipping a
// POM that drags our dependencies into every mod that depends on retrocommands.
def publishedDependencies = objects.listProperty(String)
afterEvaluate {
	['apiElements', 'runtimeElements'].each { name ->
		configurations.findByName(name)?.allDependencies?.each { dep ->
			publishedDependencies.add("$name -> ${dep.group}:${dep.name}:${dep.version}".toString())
		}
	}
}

def verifyNoPublishedDependencies = tasks.register('verifyNoPublishedDependencies') {
	description = 'Fails if any dependency would be exported transitively to consumers of retrocommands.'
	def offenders = publishedDependencies
	doLast {
		def found = offenders.get()
		if (!found.isEmpty()) {
			throw new GradleException(
				"retrocommands must not export dependencies to consuming mods, but these are on a " +
				"published configuration:\n  " + found.join("\n  ") + "\n" +
				"Use modCompileOnly/compileOnly (compile), modLocalRuntime/localRuntime (dev run) " +
				"or include (ship it nested) instead.")
		}
	}
}
tasks.named('check') { dependsOn verifyNoPublishedDependencies }
tasks.named('jar') { dependsOn verifyNoPublishedDependencies }

// Gradle module metadata republishes the full dependency graph alongside the POM, so a
// Gradle consumer would inherit it even from a POM with no <dependencies>. We publish
// neither.
tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = false
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			// Belt and braces alongside verifyNoPublishedDependencies: strip <dependencies>
			// outright so no POM we publish can ever carry one.
			pom.withXml {
				asNode().dependencies.each { it.replaceNode {} }
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
